<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 455" role="img" aria-labelledby="wam-title wam-desc">
<title id="wam-title">WAM reproduction workflow</title>
<desc id="wam-desc">Master observations feed eight analysis stages and intermediate results. Export produces numbered figures, tables and a checksum manifest. Optional native samples form a separate Metronautica example workflow.</desc>
<defs><marker id="wam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#79c0ff"/></marker><marker id="sample-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#39c5bb"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#e6edf3}.heading{font-size:22px;font-weight:600}.body{font-size:19px}.small{font-size:16px;fill:#b5c0ce}.code{font-family:Consolas,monospace;font-size:16px}.panel{fill:#161b22;stroke:#586574;stroke-width:1.5}.optional{stroke:#39c5bb;stroke-dasharray:7 5}.arrow{fill:none;stroke:#79c0ff;stroke-width:2;marker-end:url(#wam-arrow)}.sample-arrow{fill:none;stroke:#39c5bb;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#sample-arrow)}</style>
<rect width="1320" height="455" rx="10" fill="#0d1117"/>
<g><title>WAM starts from the supplied full-cohort master observations.</title><rect x="30" y="45" width="230" height="200" rx="7" class="panel"/><text x="145.0" y="87" class="heading" text-anchor="middle">Master observations</text><text x="145.0" y="137" class="code" text-anchor="middle">data/</text><text x="145.0" y="177" class="small" text-anchor="middle">Static, dynamic, features</text><text x="145.0" y="205" class="small" text-anchor="middle">Diagnostics and timing</text></g><g><title>Eight analysis stages produce intermediate statistics and plots. Use the code guide for prerequisites; this block does not imply independent execution.</title><rect x="310" y="45" width="370" height="200" rx="7" class="panel"/><text x="495.0" y="87" class="heading" text-anchor="middle">Analysis stages</text></g><text x="410" y="132" class="code" text-anchor="middle">static</text><text x="585" y="132" class="code" text-anchor="middle">dynamic</text><text x="410" y="163" class="code" text-anchor="middle">features</text><text x="585" y="163" class="code" text-anchor="middle">diagnostics</text><text x="410" y="194" class="code" text-anchor="middle">sensitivity</text><text x="585" y="194" class="code" text-anchor="middle">frequency</text><text x="410" y="225" class="code" text-anchor="middle">activation</text><text x="585" y="225" class="code" text-anchor="middle">threshold_transfer</text><g><title>Analysis stages write intermediate outputs under analysis/. A named stage does not export numbered assets.</title><rect x="730" y="45" width="230" height="200" rx="7" class="panel"/><text x="845.0" y="87" class="heading" text-anchor="middle">Intermediate results</text><text x="845.0" y="137" class="code" text-anchor="middle">analysis/</text><text x="845.0" y="177" class="small" text-anchor="middle">Statistics, tables, plots</text><text x="845.0" y="205" class="small" text-anchor="middle">Runtime records</text></g><g><title>Export assembles the registered assets and their SHA-256 manifest. The all command includes export.</title><rect x="1010" y="45" width="280" height="200" rx="7" class="panel"/><text x="1150.0" y="87" class="heading" text-anchor="middle">Numbered assets</text><text x="1150.0" y="137" class="code" text-anchor="middle">results/</text><text x="1150.0" y="177" class="small" text-anchor="middle">Figures and tables</text><text x="1150.0" y="205" class="code" text-anchor="middle">assets.csv</text></g><path d="M260 145 H300" class="arrow"/><path d="M680 145 H720" class="arrow"/><path d="M960 145 H1000" class="arrow"/><text x="985" y="125" class="small" text-anchor="middle">export</text><text x="660" y="286" class="small" text-anchor="middle">Run all: eight analysis stages, then export. Selected stages require their prerequisites.</text><g><title>Native recordings are included in samples/. They are not inputs to the master-based WAM analysis.</title><rect x="30" y="330" width="320" height="95" rx="7" class="panel optional"/><text x="190.0" y="372" class="heading" text-anchor="middle">Optional native samples</text><text x="190.0" y="405" class="code" text-anchor="middle">samples/ native recordings</text></g><path d="M350 378 H430" class="sample-arrow"/><g><title>Use m_load_sample_data() and the Metronautica Getting Started guide to parse and assess the optional samples.</title><rect x="440" y="330" width="390" height="95" rx="7" class="panel optional"/><text x="635.0" y="372" class="heading" text-anchor="middle">Metronautica examples</text><text x="635.0" y="405" class="code" text-anchor="middle">m_load_sample_data()</text></g><text x="1060" y="372" class="body" text-anchor="middle">Separate sample workflow</text><text x="1060" y="402" class="small" text-anchor="middle">Independent of master analyses</text>
</svg>
